name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI .env
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=ci_dummy_key
          ANTHROPIC_API_KEY=ci_dummy_key
          SAVE_DATA_SECRET_KEY=ci_dummy_secret_key_for_testing
          EOF

      - name: Analyze
        run: flutter analyze

      - name: Build APK (debug)
        run: flutter build apk --debug
